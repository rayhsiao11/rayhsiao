<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盲測回放 v6 — 雲端同步版</title>
<style>
  :root {
    --bg:#0B0E14; --panel:#12161F; --border:#1E2530; --text:#E6EAF2;
    --dim:#8B93A7; --faint:#5A6172; --up:#0ECB81; --down:#F6465D; --acc:#F0B90B;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px 12px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .hint { font-size:11px; color:var(--faint); }
  button { padding:7px 12px; border-radius:7px; border:1px solid var(--border);
    background:var(--panel); color:#C7CDDB; font-size:12px; font-weight:600;
    cursor:pointer; font-family:inherit; }
  button.on { background:var(--acc); border-color:var(--acc); color:#0B0E14; }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  input.maIn { width:46px; padding:5px 4px; border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:12px; text-align:center;
    font-family:ui-monospace,monospace; }
  input.maIn:focus { outline:1px solid var(--acc); }
  .big { flex:1; padding:13px 0; font-size:15px; }
  #betUp { border-color:var(--up); color:var(--up); }
  #betDown { border-color:var(--down); color:var(--down); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  #acctBar { padding:10px 14px; margin-top:10px; display:flex; gap:12px; flex-wrap:wrap;
    align-items:center; font-size:12.5px; }
  #syncTxt { font-size:11px; }
  #cooldownBar { display:none; padding:10px 14px; margin-top:8px; border-radius:10px;
    border:1px solid var(--down); color:var(--down); font-size:13px; text-align:center;
    background:#F6465D14; }
  #chartBox { position:relative; padding:6px; margin-top:10px; }
  #cv { width:100%; display:block; touch-action:none; cursor:crosshair; }
  #stamp { position:absolute; inset:0; display:none; place-items:center; pointer-events:none; }
  #stamp > div { border:3px solid; padding:8px 28px; border-radius:10px; font-size:25px;
    font-weight:800; letter-spacing:6px; background:#0B0E14CC; transform:rotate(-4deg);
    animation:stampIn .25s ease-out; }
  #panBadge { position:absolute; top:12px; left:12px; display:none; font-size:12px;
    color:var(--dim); border:1px solid var(--dim); border-radius:6px; padding:3px 10px;
    background:#0B0E14CC; cursor:pointer; }
  #histNote { position:absolute; top:12px; right:64px; display:none; font-size:11px;
    color:var(--faint); background:#0B0E14CC; padding:2px 8px; border-radius:6px; }
  @keyframes stampIn { from { transform:scale(1.6) rotate(-4deg); opacity:0 }
                       to { transform:scale(1) rotate(-4deg); opacity:1 } }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
  .stats { padding:16px; margin-top:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
    gap:12px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .st .l { font-size:11px; color:var(--dim); font-family:'Noto Sans TC',sans-serif; }
  .st .v { font-size:17px; font-weight:700; margin-top:2px; }
  .st .s { font-size:10.5px; color:var(--faint); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #verdict { color:var(--acc); margin-top:4px; }
  .foot { margin-top:10px; font-size:10.5px; color:var(--faint); line-height:1.6; }
  #loadCover { position:absolute; inset:0; display:none; place-items:center;
    color:var(--dim); background:#12161FE6; border-radius:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
    <div>
      <div style="font-size:19px;font-weight:700;letter-spacing:1px">盲測回放 v6
        <span class="hint">雲端同步版</span></div>
      <div style="font-size:11.5px;color:var(--dim);margin-top:2px">
        300U 帳戶與紀錄可跨裝置共用（GitHub Gist）</div>
    </div>
    <div class="mono" id="topInfo" style="font-size:12.5px;color:var(--acc)"></div>
  </div>

  <div class="row" style="margin-bottom:8px">
    <button data-sym="BTCUSDT" class="symBtn on">BTC</button>
    <button data-sym="ETHUSDT" class="symBtn">ETH</button>
    <span style="width:8px"></span>
    <button data-hz="10" class="hzBtn on">押 10 分</button>
    <button data-hz="30" class="hzBtn">押 30 分</button>
    <button data-hz="60" class="hzBtn">押 60 分</button>
    <span style="flex:1"></span>
    <button id="newSeg">換一段歷史</button>
  </div>

  <div class="row" style="margin-bottom:4px">
    <span class="hint">週期</span>
    <button data-tf="1" class="tfBtn on">1m</button>
    <button data-tf="5" class="tfBtn">5m</button>
    <button data-tf="10" class="tfBtn">10m</button>
    <button data-tf="15" class="tfBtn">15m</button>
    <button data-tf="30" class="tfBtn">30m</button>
    <button data-tf="60" class="tfBtn">1H</button>
    <span style="width:10px"></span>
    <button id="maBtn" class="on">MA</button>
    <input class="maIn" id="ma1" type="number" min="2" max="500" value="7">
    <input class="maIn" id="ma2" type="number" min="2" max="500" value="25">
    <input class="maIn" id="ma3" type="number" min="2" max="500" value="99">
    <button id="bollBtn">BOLL</button>
    <span style="width:6px"></span>
    <button data-sub="none" class="subBtn">無副圖</button>
    <button data-sub="vol" class="subBtn on">VOL</button>
    <button data-sub="rsi" class="subBtn">RSI</button>
    <button data-sub="macd" class="subBtn">MACD</button>
    <span style="flex:1"></span>
    <button id="zoomOut">－</button>
    <button id="zoomIn">＋</button>
  </div>

  <div class="card" id="acctBar">
    <span>帳戶 <b class="mono" id="balTxt" style="font-size:15px"></b></span>
    <span class="hint">單筆</span>
    <button data-st="5" class="stBtn">5U</button>
    <button data-st="10" class="stBtn">10U</button>
    <button data-st="20" class="stBtn on">20U</button>
    <span class="hint" id="bustTxt"></span>
    <span style="flex:1"></span>
    <span id="syncTxt" class="hint">未設定同步</span>
    <button id="syncBtn">☁ 同步設定</button>
    <button id="csvBtn">匯出 CSV</button>
    <button id="acctReset">重置帳戶</button>
  </div>
  <div id="cooldownBar"></div>

  <div class="card" id="chartBox">
    <canvas id="cv"></canvas>
    <div id="panBadge">回看中（下單仍在最前緣）· 點此回到現在</div>
    <div id="histNote">載入更早歷史中…</div>
    <div id="stamp"><div id="stampInner"></div></div>
    <div id="loadCover"><div id="loadMsg">抽取隨機歷史片段中…</div></div>
  </div>

  <div class="row" style="margin-top:10px" id="ctrlRow">
    <button id="betUp" class="big">看漲 ▲</button>
    <button id="betDown" class="big">看跌 ▼</button>
    <span class="hint">看戲不下單→</span>
    <button id="step1">+1</button>
    <button id="step5">+5</button>
    <button id="step30">+30</button>
  </div>
  <div class="row" style="margin-top:6px">
    <div class="mono" id="resultLine" style="flex:1;font-size:12.5px;color:var(--dim);padding:2px 4px"></div>
  </div>

  <div class="card stats">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:12.5px;color:var(--dim)">累積統計（由交易日誌重算）</div>
      <button id="resetBtn" style="border:none;background:none;color:var(--faint)">全部歸零</button>
    </div>
    <div class="grid" id="statGrid"></div>
    <div style="margin-top:13px;padding-top:11px;border-top:1px solid var(--border);font-size:12.5px">
      <span style="color:var(--dim)">運氣檢定（vs 兩平線 55.6%）：</span>
      <span class="mono" id="pval">樣本不足</span>
      <div id="verdict"></div>
    </div>
  </div>

  <div class="foot">
    交易日誌是唯一事實來源：餘額、勝率、連敗、冷靜期全部由日誌重算，因此多裝置同步只需合併日誌、永不衝突。
    同步使用你自己 GitHub 帳號的私密 Gist——Token 只存在各裝置瀏覽器，不會寫進雲端檔案。
    行情僅向幣安「下載」，不上傳任何內容。僅供訓練驗證，非投資建議。
  </div>
</div>

<script>
"use strict";
// ─── 常數 ───────────────────────────────────────────────
const BREAKEVEN = 1/1.8, PAYOUT = 0.8;
const START_BAL = 300, MIN_STAKE = 5;
const COOLDOWN_MS = 10*60*1000, STREAK_TRIGGER = 3;
const HOSTS = ["https://data-api.binance.vision","https://api.binance.com"];
const EARLIEST = Date.UTC(2019,0,1);
const JKEY="blind-replay-journal-v2", SKEY="blind-replay-sync-v1", PKEY="blind-replay-prefs-v1";
const EMPTY = { wins:0,losses:0,flats:0,up:{w:0,l:0},down:{w:0,l:0},streak:0,worstStreak:0,pnl:0 };
const API_IV = {5:"5m",10:"5m",15:"15m",30:"30m",60:"1h"};
const GIST_FILE = "blind_replay_journal.json";

// ─── 狀態 ───────────────────────────────────────────────
function lsGet(k,def){ try{const s=localStorage.getItem(k); if(s) return Object.assign(JSON.parse(JSON.stringify(def)), JSON.parse(s));}catch(e){} return JSON.parse(JSON.stringify(def)); }
function lsGetArr(k){ try{const s=localStorage.getItem(k); if(s){const a=JSON.parse(s); if(Array.isArray(a)) return a;}}catch(e){} return []; }

const S = {
  symbol:"BTCUSDT", horizon:10, tfMin:1,
  bars:[], nowIdx:0, deep:{}, deepLoading:{},
  phase:"loading", entryIdx:null, guessDir:null, result:null,
  offset:0, count:150,
  overlays:{ma:true,boll:false}, sub:"vol", maP:[7,25,99],
  journal: migrate(lsGetArr(JKEY).concat(lsGetArr("blind-replay-journal-v1"))),
  prefs: lsGet(PKEY,{stake:20}),
  sync: lsGet(SKEY,{token:"",gist:""}),
  stats: JSON.parse(JSON.stringify(EMPTY)),
  acct: {balance:START_BAL, busts:0, cooldownUntil:0},
  fetchingOlder:false, noMoreFuture:false,
};
let revealTimer=null, pushTimer=null;

function migrate(arr){   // 舊版日誌補上 id 與 type
  const seen=new Set(), out=[];
  for(const e of arr){
    const id = e.id || (e.ts+"-"+(e.dir||"x")+"-"+(e.entry||0));
    if(seen.has(id)) continue; seen.add(id);
    out.push(Object.assign({type:e.type||"trade", id}, e, {id}));
  }
  out.sort((a,b)=>a.ts-b.ts);
  return out;
}
function persistJournal(){ try{ localStorage.setItem(JKEY, JSON.stringify(S.journal.slice(-5000))); }catch(e){} }
function persistPrefs(){ try{ localStorage.setItem(PKEY, JSON.stringify(S.prefs)); }catch(e){} }
function persistSync(){ try{ localStorage.setItem(SKEY, JSON.stringify(S.sync)); }catch(e){} }

// ─── 由日誌重算一切（唯一事實來源）──────────────────────
function recompute(){
  const st = JSON.parse(JSON.stringify(EMPTY));
  let bal = START_BAL, busts = 0, cooldownUntil = 0;
  let clearTs = 0;
  for(const e of S.journal) if(e.type==="clear" && e.ts>clearTs) clearTs = e.ts;
  for(const e of S.journal){
    if(e.ts < clearTs || e.type==="clear") continue;
    if(e.type==="reset"){ if(bal<MIN_STAKE) busts++; bal = START_BAL; continue; }
    if(e.type!=="trade") continue;
    if(e.outcome==="flat"){ st.flats++; continue; }
    const side = e.dir==="up" ? st.up : st.down;
    if(e.outcome==="win"){
      st.wins++; side.w++; st.pnl+=e.stake*PAYOUT; bal+=e.stake*PAYOUT;
      st.streak = st.streak>=0 ? st.streak+1 : 1;
    } else {
      st.losses++; side.l++; st.pnl-=e.stake; bal-=e.stake;
      st.streak = st.streak<=0 ? st.streak-1 : -1;
      st.worstStreak = Math.min(st.worstStreak, st.streak);
      if(st.streak<=-STREAK_TRIGGER && st.streak%STREAK_TRIGGER===0)
        cooldownUntil = e.ts + COOLDOWN_MS;
    }
  }
  S.stats = st;
  S.acct = { balance:+bal.toFixed(2), busts, cooldownUntil };
}
function addEvent(e){
  e.id = e.ts + "-" + Math.random().toString(36).slice(2,8);
  S.journal.push(e);
  S.journal.sort((a,b)=>a.ts-b.ts);
  recompute(); persistJournal(); schedulePush();
}

const cdRemain = () => Math.max(0, S.acct.cooldownUntil - Date.now());
const busted = () => S.acct.balance < MIN_STAKE;

// ─── Gist 同步 ──────────────────────────────────────────
function mergeJournal(remote){
  const map = new Map();
  for(const e of S.journal) map.set(e.id, e);
  let added = 0;
  for(const e of (remote||[])){ if(e && e.id && !map.has(e.id)){ map.set(e.id,e); added++; } }
  S.journal = [...map.values()].sort((a,b)=>a.ts-b.ts);
  return added;
}
async function syncPull(silent){
  if(!S.sync.token || !S.sync.gist) return;
  setSyncTxt("同步中…");
  try{
    const r = await fetch(`https://api.github.com/gists/${S.sync.gist}`, {
      headers:{ "Authorization":"Bearer "+S.sync.token, "Accept":"application/vnd.github+json" }});
    if(!r.ok) throw new Error(r.status);
    const g = await r.json();
    const f = g.files && g.files[GIST_FILE];
    if(f && f.content){
      const remote = JSON.parse(f.content);
      const localOnly = S.journal.filter(e => !(remote||[]).some(x=>x.id===e.id)).length;
      mergeJournal(remote);
      recompute(); persistJournal(); updateUI();
      if(localOnly>0) schedulePush();     // 本地有雲端沒有的 → 回推
    }
    setSyncTxt("✓ 已同步 " + new Date().toLocaleTimeString());
  }catch(e){ setSyncTxt("同步失敗（"+e.message+"）"); if(!silent) alert("同步拉取失敗，請檢查 Token / Gist ID"); }
}
function schedulePush(){
  if(!S.sync.token) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1500);
}
async function syncPush(){
  if(!S.sync.token) return;
  setSyncTxt("上傳中…");
  const body = { files: { [GIST_FILE]: { content: JSON.stringify(S.journal) } },
                 description: "blind replay journal", public: false };
  try{
    let r;
    if(S.sync.gist){
      r = await fetch(`https://api.github.com/gists/${S.sync.gist}`, {
        method:"PATCH",
        headers:{ "Authorization":"Bearer "+S.sync.token, "Accept":"application/vnd.github+json" },
        body: JSON.stringify(body) });
    } else {
      r = await fetch("https://api.github.com/gists", {
        method:"POST",
        headers:{ "Authorization":"Bearer "+S.sync.token, "Accept":"application/vnd.github+json" },
        body: JSON.stringify(body) });
      if(r.ok){ const g = await r.json(); S.sync.gist = g.id; persistSync();
        alert("已建立雲端存檔！Gist ID（另一台裝置設定時要輸入）：\n\n"+g.id); }
    }
    if(!r.ok) throw new Error(r.status);
    setSyncTxt("✓ 已同步 " + new Date().toLocaleTimeString());
  }catch(e){ setSyncTxt("上傳失敗（"+e.message+"）"); }
}
function setSyncTxt(t){ $("syncTxt").textContent = t; }
function syncSetup(){
  const tk = prompt(
    "GitHub Token（classic，只勾 gist 權限）：\n"+
    "GitHub → Settings → Developer settings → Personal access tokens (classic)\n"+
    "→ Generate new token → 只勾「gist」→ 產生後貼到這裡。\n\n"+
    "Token 只存在這台裝置的瀏覽器。", S.sync.token || "");
  if(tk===null) return;
  S.sync.token = tk.trim();
  const gid = prompt(
    "Gist ID：\n第一台裝置留空按確定（會自動建立並顯示 ID）；\n第二台裝置貼上第一台顯示的 ID。",
    S.sync.gist || "");
  if(gid!==null) S.sync.gist = gid.trim();
  persistSync();
  if(S.sync.token && S.sync.gist) syncPull();
  else if(S.sync.token) syncPush();   // 建立新 gist
}

// ─── 統計工具 ───────────────────────────────────────────
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function pValue(w,n){ if(n<5) return null; const mu=n*BREAKEVEN, sd=Math.sqrt(n*BREAKEVEN*(1-BREAKEVEN));
  return 1-normCdf((w-0.5-mu)/sd); }
const $ = id => document.getElementById(id);

// ─── 指標 ───────────────────────────────────────────────
function smaArr(v,n){ const out=new Array(v.length).fill(null); let s=0;
  for(let i=0;i<v.length;i++){ s+=v[i]; if(i>=n) s-=v[i-n]; if(i>=n-1) out[i]=s/n; } return out; }
function emaArr(v,n){ const k=2/(n+1), out=new Array(v.length).fill(null); let prev=null;
  for(let i=0;i<v.length;i++){ prev = prev===null? v[i] : v[i]*k+prev*(1-k); if(i>=n-1) out[i]=prev; } return out; }
function bollArr(v,n=20,m=2){ const mid=smaArr(v,n), up=[],lo=[];
  for(let i=0;i<v.length;i++){ if(mid[i]===null){up.push(null);lo.push(null);continue;}
    let s=0; for(let j=i-n+1;j<=i;j++) s+=(v[j]-mid[i])**2;
    const sd=Math.sqrt(s/n); up.push(mid[i]+m*sd); lo.push(mid[i]-m*sd); }
  return {mid,up,lo}; }
function rsiArr(v,n=14){ const out=[null]; let ag=0,al=0;
  for(let i=1;i<v.length;i++){ const d=v[i]-v[i-1], g=Math.max(d,0), l=Math.max(-d,0);
    if(i<=n){ ag+=g/n; al+=l/n; out.push(i<n?null:100-100/(1+ag/(al||1e-9))); }
    else { ag=(ag*(n-1)+g)/n; al=(al*(n-1)+l)/n; out.push(100-100/(1+ag/(al||1e-9))); } }
  return out; }
function macdArr(v){ const e12=emaArr(v,12), e26=emaArr(v,26);
  const dif=v.map((_,i)=> e12[i]!==null&&e26[i]!==null? e12[i]-e26[i] : null);
  const deaRaw=emaArr(dif.map(x=>x===null?0:x),9);
  const dea=dif.map((x,i)=> x===null?null:deaRaw[i]);
  const hist=dif.map((x,i)=> x===null||dea[i]===null?null:x-dea[i]);
  return {dif,dea,hist}; }

// ─── 行情資料 ───────────────────────────────────────────
async function api(path){
  for(const h of HOSTS){
    try{ const r=await fetch(h+path); if(r.ok){ const j=await r.json(); if(Array.isArray(j)) return j; } }catch(e){}
  }
  return null;
}
const parseK = k => ({ t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] });
function bucketize(arr, bucketMs){
  const out=[];
  for(const b of arr){
    const bucket = Math.floor(b.t/bucketMs)*bucketMs;
    const last = out[out.length-1];
    if(!last || last.t!==bucket) out.push({t:bucket,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v});
    else { last.h=Math.max(last.h,b.h); last.l=Math.min(last.l,b.l); last.c=b.c; last.v+=b.v; }
  }
  return out;
}
async function newSegment(){
  clearInterval(revealTimer);
  S.phase="loading"; S.result=null; S.entryIdx=null; S.offset=0; S.tfMin=1; S.count=150;
  S.noMoreFuture=false; S.deep={}; S.deepLoading={};
  syncTfButtons(); cover("抽取隨機歷史片段中…"); updateUI();
  for(let a=0;a<5;a++){
    const start = EARLIEST + Math.random()*(Date.now()-3*86400e3-EARLIEST);
    const raw = await api(`/api/v3/klines?symbol=${S.symbol}&interval=1m&startTime=${Math.floor(start)}&limit=1000`);
    if(raw && raw.length>=900){
      S.bars = raw.map(parseK); S.nowIdx = 700;
      S.phase="guess"; coverOff(); updateUI(); draw();
      return;
    }
  }
  S.phase="error";
  cover("無法取得幣安歷史資料。<br>請確認網路後重試。<br><br><button id='retryBtn' class='on'>重試</button>");
  const rb=$("retryBtn"); if(rb) rb.onclick=newSegment;
}
async function ensureFuture(need){
  while(S.nowIdx + need + 5 >= S.bars.length){
    if(S.noMoreFuture) return false;
    const last = S.bars[S.bars.length-1];
    const raw = await api(`/api/v3/klines?symbol=${S.symbol}&interval=1m&startTime=${last.t+60000}&limit=1000`);
    if(!raw || raw.length===0){ S.noMoreFuture=true; return false; }
    S.bars = S.bars.concat(raw.map(parseK));
  }
  return true;
}
async function loadOlder1m(){
  if(S.fetchingOlder || !S.bars.length) return;
  S.fetchingOlder = true; $("histNote").style.display="block";
  const raw = await api(`/api/v3/klines?symbol=${S.symbol}&interval=1m&endTime=${S.bars[0].t-1}&limit=1000`);
  if(raw && raw.length){
    const older = raw.map(parseK);
    S.bars = older.concat(S.bars);
    S.nowIdx += older.length;
    if(S.entryIdx!==null) S.entryIdx += older.length;
    draw();
  }
  S.fetchingOlder = false; $("histNote").style.display="none";
}
async function loadDeep(m, olderThan){
  if(S.deepLoading[m]) return;
  S.deepLoading[m]=true; $("histNote").style.display="block";
  const endT = olderThan!==undefined ? olderThan : S.bars[0].t;
  const raw = await api(`/api/v3/klines?symbol=${S.symbol}&interval=${API_IV[m]}&endTime=${endT}&limit=1000`);
  if(raw && raw.length){
    let arr = raw.map(parseK);
    if(m===10) arr = bucketize(arr, 10*60000);
    const existing = S.deep[m]||[];
    S.deep[m] = arr.concat(existing.filter(b=>b.t>arr[arr.length-1].t));
    draw();
  }
  S.deepLoading[m]=false; $("histNote").style.display="none";
}
function currentSeries(){
  const upto = S.bars.slice(0, S.nowIdx+1);
  if(S.tfMin===1) return upto;
  const ms = S.tfMin*60000;
  let agg = bucketize(upto, ms);
  if(agg.length && S.bars[0].t % ms !== 0) agg = agg.slice(1);
  const deep = (S.deep[S.tfMin]||[]).filter(b => agg.length ? b.t < agg[0].t : true);
  return deep.concat(agg);
}

// ─── 動作 ───────────────────────────────────────────────
async function step(n){
  if(S.phase!=="guess" && S.phase!=="result") return;
  cover("載入資料中…");
  const ok = await ensureFuture(n);
  coverOff();
  if(!ok && S.nowIdx+n >= S.bars.length){ n = S.bars.length-1-S.nowIdx; if(n<=0){ flashResult("已到資料尾端，換一段歷史吧"); return; } }
  if(S.phase==="result"){ S.phase="guess"; S.result=null; S.entryIdx=null; }
  S.nowIdx += n; S.offset = 0;
  updateUI(); draw();
}
async function bet(dir){
  if(S.phase!=="guess") return;
  if(cdRemain()>0){ flashResult("冷靜期中，先離開螢幕休息一下"); return; }
  if(busted()){ flashResult("帳戶淨值不足，請重置帳戶"); return; }
  if(S.acct.balance < S.prefs.stake){ flashResult(`餘額不足 ${S.prefs.stake}U，換小一點的單筆金額`); return; }
  cover("載入資料中…");
  const ok = await ensureFuture(S.horizon);
  coverOff();
  if(!ok){ flashResult("未來資料不足，請換一段歷史"); return; }
  S.guessDir = dir; S.entryIdx = S.nowIdx; S.offset = 0;
  S.phase = "revealing"; S.tfMin = 1; S.count = Math.max(S.count,120); syncTfButtons();
  updateUI();
  const target = S.entryIdx + S.horizon;
  const iv = Math.max(18, 900/S.horizon);
  revealTimer = setInterval(()=>{
    S.nowIdx++;
    if(S.nowIdx>=target){ S.nowIdx=target; clearInterval(revealTimer); settle(); }
    draw();
  }, iv);
}
function settle(){
  const stake = S.prefs.stake;
  const entry = S.bars[S.entryIdx].c, fin = S.bars[S.entryIdx+S.horizon].c;
  const outcome = fin===entry ? "flat" : (fin>entry)===(S.guessDir==="up") ? "win" : "loss";
  S.result = {outcome, entry, settle:fin};
  addEvent({ ts:Date.now(), type:"trade", sym:S.symbol, hz:S.horizon,
    dir:S.guessDir, outcome, entry, settle:fin, stake });
  S.phase="result"; updateUI(); draw(); showStamp(outcome);
}
function showStamp(outcome){
  const el=$("stampInner");
  el.textContent = outcome==="win"?"預測成功":outcome==="loss"?"預測失敗":"持平退回";
  el.style.borderColor = el.style.color =
    outcome==="win"?"var(--up)":outcome==="loss"?"var(--down)":"var(--dim)";
  $("stamp").style.display="grid";
  setTimeout(()=>{ $("stamp").style.display="none"; }, 1600);
}
function flashResult(msg){ $("resultLine").textContent=msg; setTimeout(()=>updateUI(),2500); }
function cover(html){ $("loadMsg").innerHTML=html; $("loadCover").style.display="grid"; }
function coverOff(){ $("loadCover").style.display="none"; }

// ─── 繪圖 ───────────────────────────────────────────────
const cv=$("cv"), ctx=cv.getContext("2d");
function draw(){
  if(!S.bars.length) return;
  const series = currentSeries();
  if(!series.length) return;
  const closes = series.map(b=>b.c);
  const maxOffset = Math.max(0, series.length - Math.min(S.count, series.length));
  if(S.offset > maxOffset) S.offset = maxOffset;
  const end = series.length - Math.round(S.offset);
  const startI = Math.max(0, end - S.count);
  const view = series.slice(startI, end);
  if(!view.length) return;

  const ov = S.overlays;
  const [p1,p2,p3] = S.maP;
  const ma1=ov.ma&&p1?smaArr(closes,p1):null;
  const ma2=ov.ma&&p2?smaArr(closes,p2):null;
  const ma3=ov.ma&&p3?smaArr(closes,p3):null;
  const boll=ov.boll?bollArr(closes):null;
  const rsi=S.sub==="rsi"?rsiArr(closes):null;
  const macd=S.sub==="macd"?macdArr(closes):null;

  const dpr=window.devicePixelRatio||1;
  const cssW=cv.clientWidth||800;
  const MAIN=260, SUBH=S.sub==="none"?0:96, PT=10, GAPY=S.sub==="none"?0:16, PB=20;
  const cssH=PT+MAIN+GAPY+SUBH+PB;
  cv.width=cssW*dpr; cv.height=cssH*dpr; cv.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const PL=4, PR=56, bw=(cssW-PL-PR)/view.length;
  const X=i=>PL+i*bw;

  let lo=Infinity, hi=-Infinity;
  for(const b of view){ if(b.l<lo)lo=b.l; if(b.h>hi)hi=b.h; }
  if(boll) for(let i=startI;i<end;i++){ if(boll.up[i]!==null){ hi=Math.max(hi,boll.up[i]); lo=Math.min(lo,boll.lo[i]); } }
  if(hi===lo) hi=lo+1;
  const Y=v=>PT+(1-(v-lo)/(hi-lo))*MAIN;

  if(S.entryIdx!==null && (S.phase==="revealing"||S.phase==="result")){
    const ep=S.bars[S.entryIdx].c;
    if(ep>=lo&&ep<=hi){
      ctx.strokeStyle="#F0B90B"; ctx.globalAlpha=.5; ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(PL,Y(ep)); ctx.lineTo(cssW-PR,Y(ep)); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
  }
  for(let i=0;i<view.length;i++){
    const b=view[i], up=b.c>=b.o, col=up?"#0ECB81":"#F6465D", cx=X(i)+bw/2;
    ctx.strokeStyle=col; ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(cx,Y(b.h)); ctx.lineTo(cx,Y(b.l)); ctx.stroke();
    const yTop=Y(Math.max(b.o,b.c)), hh=Math.max(1,Math.abs(Y(b.o)-Y(b.c)));
    ctx.fillRect(X(i)+bw*0.18, yTop, Math.max(1,bw*0.64), hh);
  }
  const plot=(arr,color,dash)=>{ ctx.strokeStyle=color; ctx.lineWidth=1.2;
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); let started=false;
    for(let i=startI;i<end;i++){ const v=arr[i]; if(v===null){started=false;continue;}
      const px=X(i-startI)+bw/2, py=Y(v);
      if(!started){ctx.moveTo(px,py);started=true;} else ctx.lineTo(px,py); }
    ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; };
  if(ma1) plot(ma1,"#F0B90B"); if(ma2) plot(ma2,"#EC4899"); if(ma3) plot(ma3,"#8B5CF6");
  if(boll){ plot(boll.up,"#60A5FA",[3,3]); plot(boll.mid,"#60A5FA"); plot(boll.lo,"#60A5FA",[3,3]); }

  ctx.fillStyle="#8B93A7"; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.textAlign="left";
  for(const f of [0,0.5,1]){ const v=lo+(hi-lo)*f;
    ctx.fillText(v.toFixed(v>100?0:2), cssW-PR+6, Y(v)+4); }

  const subTop=PT+MAIN+GAPY;
  if(S.sub==="vol"){
    let vmax=1e-9; for(const b of view) vmax=Math.max(vmax,b.v);
    for(let i=0;i<view.length;i++){ const b=view[i];
      ctx.fillStyle=(b.c>=b.o?"#0ECB81":"#F6465D"); ctx.globalAlpha=.7;
      const h2=b.v/vmax*SUBH; ctx.fillRect(X(i)+bw*0.18, subTop+SUBH-h2, Math.max(1,bw*0.64), h2); }
    ctx.globalAlpha=1;
  } else if(S.sub==="rsi" && rsi){
    const RY=v=>subTop+(1-v/100)*SUBH;
    ctx.strokeStyle="#2A3140"; ctx.setLineDash([3,4]);
    for(const g of [30,70]){ ctx.beginPath(); ctx.moveTo(PL,RY(g)); ctx.lineTo(cssW-PR,RY(g)); ctx.stroke();
      ctx.fillStyle="#5A6172"; ctx.fillText(String(g), cssW-PR+6, RY(g)+4); }
    ctx.setLineDash([]);
    ctx.strokeStyle="#F0B90B"; ctx.lineWidth=1.3; ctx.beginPath(); let st2=false;
    for(let i=startI;i<end;i++){ const v=rsi[i]; if(v===null){st2=false;continue;}
      const px=X(i-startI)+bw/2, py=RY(v);
      if(!st2){ctx.moveTo(px,py);st2=true;} else ctx.lineTo(px,py); }
    ctx.stroke(); ctx.lineWidth=1;
  } else if(S.sub==="macd" && macd){
    let m=1e-9; for(let i=startI;i<end;i++){ for(const a of [macd.dif,macd.dea,macd.hist])
      if(a[i]!==null) m=Math.max(m,Math.abs(a[i])); }
    const MY=v=>subTop+(1-(v+m)/(2*m))*SUBH;
    ctx.strokeStyle="#2A3140"; ctx.beginPath(); ctx.moveTo(PL,MY(0)); ctx.lineTo(cssW-PR,MY(0)); ctx.stroke();
    for(let i=startI;i<end;i++){ const v=macd.hist[i]; if(v===null) continue;
      ctx.fillStyle=v>=0?"#0ECB81":"#F6465D"; ctx.globalAlpha=.7;
      const y0=MY(0), y1=MY(v);
      ctx.fillRect(X(i-startI)+bw*0.25, Math.min(y0,y1), Math.max(1,bw*0.5), Math.max(.5,Math.abs(y1-y0))); }
    ctx.globalAlpha=1;
    const plotSub=(arr,color)=>{ ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.beginPath(); let st3=false;
      for(let i=startI;i<end;i++){ const v=arr[i]; if(v===null){st3=false;continue;}
        const px=X(i-startI)+bw/2, py=MY(v);
        if(!st3){ctx.moveTo(px,py);st3=true;} else ctx.lineTo(px,py); }
      ctx.stroke(); ctx.lineWidth=1; };
    plotSub(macd.dif,"#F0B90B"); plotSub(macd.dea,"#8B5CF6");
  }
  if(end===series.length){
    const nx=X(view.length-1)+bw/2;
    ctx.strokeStyle="#F0B90B"; ctx.globalAlpha=.6; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(nx,PT); ctx.lineTo(nx,PT+MAIN); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.fillStyle="#F0B90B"; ctx.textAlign="center"; ctx.fillText("現在", nx, cssH-6);
  }
  ctx.fillStyle="#5A6172"; ctx.textAlign="left";
  const minsBack = i => (series.length-1-(startI+i))*S.tfMin;
  const label = m => m>=1440? `−${(m/1440).toFixed(1)}d` : m>=120? `−${(m/60).toFixed(1)}h` : `−${m}m`;
  ctx.fillText(label(minsBack(0)), PL+2, cssH-6);
  if(end!==series.length){ ctx.textAlign="right"; ctx.fillText(label(minsBack(view.length-1)), cssW-PR-4, cssH-6); }
  $("panBadge").style.display = S.offset>0.5 ? "block" : "none";
}

// ─── 面板 ───────────────────────────────────────────────
function statCell(l,v,s,color){ return `<div class="st"><div class="l">${l}</div><div class="v" style="color:${color||"var(--text)"}">${v}</div><div class="s">${s}</div></div>`; }
function updateStats(){
  const st=S.stats, dec=st.wins+st.losses, wr=dec?st.wins/dec:0;
  const upN=st.up.w+st.up.l, dnN=st.down.w+st.down.l;
  $("statGrid").innerHTML =
    statCell("有效樣本",`${dec} 筆`,`持平 ${st.flats}`)+
    statCell("勝率", dec?(wr*100).toFixed(1)+"%":"—", `兩平線 ${(BREAKEVEN*100).toFixed(1)}%`,
      dec?(wr>BREAKEVEN?"var(--up)":"var(--down)"):null)+
    statCell("累計損益",`${st.pnl>=0?"+":""}${st.pnl.toFixed(1)} U`,`含歷次帳戶`,
      st.pnl>=0?"var(--up)":"var(--down)")+
    statCell("押漲勝率", upN?(st.up.w/upN*100).toFixed(0)+"%":"—", `${upN} 筆`)+
    statCell("押跌勝率", dnN?(st.down.w/dnN*100).toFixed(0)+"%":"—", `${dnN} 筆`)+
    statCell("最長連敗",`${Math.abs(st.worstStreak)} 筆`,`目前${st.streak>=0?"連勝":"連敗"} ${Math.abs(st.streak)}`);
  const p=pValue(st.wins,dec);
  $("pval").textContent = (p!==null&&dec>=20) ? `p ≈ ${p<0.001?"<0.001":p.toFixed(3)}` : "樣本不足";
  let verdict="樣本還太少，先累積到 50 筆再看。";
  if(dec>=50){
    if(p===null||p>0.2) verdict="表現與「無 edge」無法區分，繼續累積樣本。";
    else if(p>0.05) verdict="有苗頭，但仍可能是運氣，需要更多樣本。";
    else verdict="初步顯著：勝率高於兩平線大概率不是運氣。";
  }
  $("verdict").textContent=verdict;
}
function updateAcct(){
  const b=S.acct.balance;
  $("balTxt").textContent = b.toFixed(1)+" U";
  $("balTxt").style.color = busted() ? "var(--down)" : b>=START_BAL ? "var(--up)" : "var(--text)";
  $("bustTxt").textContent = S.acct.busts>0 ? `爆倉 ${S.acct.busts} 次` : "";
  document.querySelectorAll(".stBtn").forEach(x=>x.classList.toggle("on", +x.dataset.st===S.prefs.stake));
  const cd=cdRemain();
  if(cd>0){
    const mm=String(Math.floor(cd/60000)), ss=String(Math.floor(cd%60000/1000)).padStart(2,"0");
    $("cooldownBar").style.display="block";
    $("cooldownBar").textContent=`⏸ 連敗冷靜期：${mm}:${ss} 後才能再下單（先離開螢幕走走）`;
  } else $("cooldownBar").style.display="none";
}
function updateUI(){
  $("topInfo").textContent = `${S.symbol} / 押 ${S.horizon} 分`;
  const g = S.phase==="guess";
  const canBet = g && cdRemain()===0 && !busted() && S.acct.balance>=S.prefs.stake;
  $("betUp").disabled = $("betDown").disabled = !canBet;
  const stepOk = g || S.phase==="result";
  $("step1").disabled=$("step5").disabled=$("step30").disabled = !stepOk;
  if(S.phase==="result" && S.result){
    const r=S.result, col=r.outcome==="win"?"var(--up)":r.outcome==="loss"?"var(--down)":"var(--dim)";
    $("resultLine").innerHTML =
      `開倉 ${r.entry.toFixed(2)} → 結算 <span style="color:${col}">${r.settle.toFixed(2)}</span>` +
      `（${((r.settle/r.entry-1)*100).toFixed(3)}%）　可繼續在新前緣下單，或換一段歷史`;
  } else if(S.phase==="revealing"){ $("resultLine").textContent="揭曉中…";
  } else if(busted()){ $("resultLine").textContent="帳戶已輸光——重置前先想想：剛剛哪幾筆不該下？";
  } else { $("resultLine").textContent=""; }
  updateStats(); updateAcct();
}
function syncTfButtons(){
  document.querySelectorAll(".tfBtn").forEach(b=>b.classList.toggle("on", +b.dataset.tf===S.tfMin));
}
function exportCsv(){
  const trades=S.journal.filter(e=>e.type==="trade");
  if(!trades.length){ flashResult("還沒有任何下單紀錄"); return; }
  const head="time,symbol,horizon_min,direction,outcome,entry,settle,stake";
  const rows=trades.map(j=>[new Date(j.ts).toISOString(),j.sym,j.hz,j.dir,j.outcome,j.entry,j.settle,j.stake].join(","));
  const blob=new Blob(["\uFEFF"+head+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="blind_replay_journal.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

// ─── 事件 ───────────────────────────────────────────────
document.querySelectorAll(".symBtn").forEach(b=>b.onclick=()=>{
  S.symbol=b.dataset.sym;
  document.querySelectorAll(".symBtn").forEach(x=>x.classList.toggle("on",x===b));
  newSegment();
});
document.querySelectorAll(".hzBtn").forEach(b=>b.onclick=()=>{
  S.horizon=+b.dataset.hz;
  document.querySelectorAll(".hzBtn").forEach(x=>x.classList.toggle("on",x===b));
  updateUI();
});
document.querySelectorAll(".tfBtn").forEach(b=>b.onclick=()=>{
  if(S.phase==="revealing") return;
  S.tfMin=+b.dataset.tf; S.offset=0; S.count=150; syncTfButtons();
  if(S.tfMin>1 && !S.deep[S.tfMin]) loadDeep(S.tfMin);
  draw();
});
document.querySelectorAll(".stBtn").forEach(b=>b.onclick=()=>{
  S.prefs.stake=+b.dataset.st; persistPrefs(); updateUI();
});
for(const [i,id] of ["ma1","ma2","ma3"].entries()){
  $(id).onchange = $(id).oninput = ()=>{
    const v = parseInt($(id).value,10);
    S.maP[i] = (v>=2 && v<=500) ? v : 0;
    draw();
  };
}
$("maBtn").onclick=()=>{ S.overlays.ma=!S.overlays.ma; $("maBtn").classList.toggle("on"); draw(); };
$("bollBtn").onclick=()=>{ S.overlays.boll=!S.overlays.boll; $("bollBtn").classList.toggle("on"); draw(); };
document.querySelectorAll(".subBtn").forEach(b=>b.onclick=()=>{
  S.sub=b.dataset.sub;
  document.querySelectorAll(".subBtn").forEach(x=>x.classList.toggle("on",x===b));
  draw();
});
$("newSeg").onclick=newSegment;
$("betUp").onclick=()=>bet("up");
$("betDown").onclick=()=>bet("down");
$("step1").onclick=()=>step(1);
$("step5").onclick=()=>step(5);
$("step30").onclick=()=>step(30);
$("zoomIn").onclick=()=>{ S.count=Math.max(20,Math.round(S.count*0.8)); draw(); };
$("zoomOut").onclick=()=>{ S.count=Math.min(1200,Math.round(S.count*1.25)); maybeLoadLeft(); draw(); };
$("panBadge").onclick=()=>{ S.offset=0; draw(); };
$("acctReset").onclick=()=>{
  if(!busted() && !confirm("帳戶還沒輸光，確定要重置成 300U？")) return;
  addEvent({ts:Date.now(), type:"reset"}); updateUI();
};
$("csvBtn").onclick=exportCsv;
$("syncBtn").onclick=syncSetup;
$("resetBtn").onclick=()=>{
  if(!confirm("全部歸零？（統計、帳戶、爆倉次數都會重來；若已設定同步，所有裝置一起歸零）")) return;
  addEvent({ts:Date.now(), type:"clear"}); updateUI();
};

cv.addEventListener("wheel", e=>{
  e.preventDefault();
  if(e.deltaY<0) S.count=Math.max(20,Math.round(S.count*0.88));
  else S.count=Math.min(1200,Math.round(S.count*1.14));
  maybeLoadLeft(); draw();
},{passive:false});
function maybeLoadLeft(){
  const series=currentSeries();
  if(S.offset + S.count < series.length - 3) return;
  if(S.tfMin===1) loadOlder1m();
  else {
    const deep=S.deep[S.tfMin];
    loadDeep(S.tfMin, deep&&deep.length? deep[0].t-1 : undefined);
  }
}
let dragX=null, dragOffset=0;
cv.addEventListener("pointerdown", e=>{ dragX=e.clientX; dragOffset=S.offset; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{
  if(dragX===null) return;
  const series=currentSeries();
  const bw=(cv.clientWidth-60)/Math.min(S.count,series.length||1);
  S.offset = dragOffset + (e.clientX-dragX)/Math.max(bw,0.5);
  const maxOff = Math.max(0, series.length-S.count);
  if(S.offset<0) S.offset=0;
  if(S.offset>=maxOff-3) maybeLoadLeft();
  if(S.offset>maxOff) S.offset=maxOff;
  draw();
});
const endDrag=()=>{ dragX=null; };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
window.addEventListener("resize", draw);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncPull(true); });
setInterval(()=>{ if(cdRemain()>0 || $("cooldownBar").style.display==="block") updateUI(); }, 1000);

// ─── 啟動 ───────────────────────────────────────────────
recompute();
updateUI();
if(S.sync.token && S.sync.gist){ setSyncTxt("同步中…"); syncPull(true); }
newSegment();
</script>
